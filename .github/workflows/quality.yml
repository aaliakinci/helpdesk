name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    container: node:24.19.0-bookworm-slim
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: helpdesk
          POSTGRES_PASSWORD: ci-helpdesk-password
          POSTGRES_USER: helpdesk
        options: >-
          --health-cmd "pg_isready -U helpdesk -d helpdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:4.3.4-management
        env:
          RABBITMQ_DEFAULT_PASS: ci-helpdesk-password
          RABBITMQ_DEFAULT_USER: helpdesk
          RABBITMQ_DEFAULT_VHOST: helpdesk
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.2.8-bookworm
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ACCESS_TOKEN_SECRET: ci-access-token-secret-at-least-32-bytes
      APP_VERSION: 0.0.0-ci
      DATABASE_URL: postgresql://helpdesk:ci-helpdesk-password@postgres:5432/helpdesk?schema=public
      NODE_ENV: test
      RABBITMQ_URL: amqp://helpdesk:ci-helpdesk-password@rabbitmq:5672/helpdesk
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: http://127.0.0.1:5173
      DEMO_SEED_PASSWORD: ci-demo-password-never-used-in-production
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL
        run: apt-get update && apt-get install --yes --no-install-recommends openssl
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Audit production dependency vulnerabilities
        run: npm run verify:dependency-audit
      - name: Verify static quality gates
        run: npm run verify
      - name: Verify migrations from an empty database
        run: npm run verify:migrations
      - name: Apply database migrations
        run: npm run db:migrate:deploy
      - name: Seed deterministic demo identities
        run: npm run db:seed
      - name: Verify PostgreSQL query plans
        run: npm run verify:query-plans
      - name: Verify infrastructure integration
        run: npm run test:integration
      - name: Install Chromium for the browser quality gate
        run: npx playwright install --with-deps chromium
      - name: Verify responsive and accessible web routes
        run: |
          npm run start:api > /tmp/helpdesk-api.log 2>&1 &
          api_pid=$!
          npm run dev:web > /tmp/helpdesk-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid"' EXIT
          for attempt in $(seq 1 60); do
            if node -e "fetch('http://127.0.0.1:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" && node -e "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              break
            fi
            sleep 1
          done
          npm run test:e2e:accessibility

  image-security:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [support-api, support-worker]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.target }} image
        run: docker build --file deploy/Dockerfile --target "${{ matrix.target }}" --tag "helpdesk-${{ matrix.target }}:ci" .
      - name: Scan ${{ matrix.target }} image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          exit-code: "1"
          format: table
          ignore-unfixed: true
          image-ref: helpdesk-${{ matrix.target }}:ci
          severity: CRITICAL,HIGH
          version: v0.74.0
          vuln-type: os,library
